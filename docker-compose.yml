# Local/single-host stack: nginx serves the SPA and proxies /api to the API,
# which starts sandbox containers on the host's Docker daemon.
#
# Build the sandbox images first. With SANDBOX_MODE=docker the API won't run
# submissions without them:
#
#   ./sandbox/build.sh && docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY — the app will not run on a default signing key}
      SANDBOX_MODE: docker
      SANDBOX_TAG: ${SANDBOX_TAG:-latest}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      DB_PATH: /data/algobattle.db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # The API uses the host's Docker daemon to start each submission in its
      # own container. This socket is basically root on the host, so don't run
      # anything else on this instance (see deploy/README.md).
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite lives on a volume so ratings survive a redeploy.
      - algobattle-data:/data
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped

  # GitHub OAuth2 login (Spring Boot). Without GITHUB_CLIENT_ID the button
  # still shows but GitHub will reject the login; password login is unaffected.
  auth:
    build:
      context: auth-service
    environment:
      SECRET_KEY: ${SECRET_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-not-configured}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-not-configured}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
    volumes:
      - auth-data:/data
    expose:
      - "8081"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      BACKEND_HOST: backend
      AUTH_HOST: auth
    volumes:
      - ./deploy/nginx-auth.location.template:/etc/nginx/templates/locations/auth.conf.template:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - auth
    restart: unless-stopped

volumes:
  algobattle-data:
  auth-data:
