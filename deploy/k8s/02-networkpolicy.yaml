# Same idea as Docker's --network none: runner pods get no egress, so a
# submission can't send data out, download anything, or hit other hosts.
#
# kind's default CNI doesn't enforce NetworkPolicy. The policy applies fine
# but only actually works on clusters running Calico or Cilium. On default
# kind, what protects the API server is that the Job has no service account
# token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-egress
  namespace: algobattle
spec:
  podSelector:
    matchLabels:
      algobattle.io/runner: "true"
  policyTypes: ["Egress", "Ingress"]
  egress: []
  ingress: []
