# The Docker backend passes --network none. This is the equivalent: runner pods
# get no egress at all, so a submission cannot exfiltrate, fetch a payload, or
# use the cluster as a source of traffic.
#
# Note kind's default CNI does not enforce NetworkPolicy. The policy is correct
# and applies cleanly, but on kind it is declarative only — a cluster running
# Calico or Cilium enforces it. The Job's lack of a service account token is
# what actually protects the API server on kind.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-egress
  namespace: algobattle
spec:
  podSelector:
    matchLabels:
      algobattle.io/runner: "true"
  policyTypes: ["Egress", "Ingress"]
  egress: []
  ingress: []
